[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# No solc pin: swap-vm/aqua require =0.8.30, Uniswap v4 requires =0.8.26.
# Forge auto-detects per compilation unit; keep our sources' pragmas compatible.

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 128
fail_on_revert = false
